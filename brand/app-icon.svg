<?xml version="1.0" encoding="UTF-8"?>
<!--
  Daily English — production app icon master · Concept 3 "The Climb"
  ============================================================================
  Ascending rounded CEFR steps (A1→C2) + a coral progress arc rising to a
  summit, on a teal→violet "action → progress" gradient, clipped to the iOS
  superellipse (full-bleed, export-ready at 1024×1024).

  Refined for small-size legibility (must read at 40–120px):
    - 4 bold steps, solid white (no per-step opacity that muddies at small px)
    - thicker coral arc (stroke 56) so it survives downscaling
    - large two-tone summit dot as the focal point
    - generous step gaps + corner radius for clean silhouette
  Build-time export (do NOT do here): rasterize this master to the iOS asset
  catalog PNG set + web favicon / PWA sizes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Daily English app icon: ascending steps and a coral arc rising to a summit on a teal-to-violet gradient">
  <defs>
    <!-- iOS superellipse (squircle) -->
    <clipPath id="squircle">
      <path d="M512 0C197 0 119 0 59.5 59.5 0 119 0 197 0 512s0 393 59.5 452.5C119 1024 197 1024 512 1024s393 0 452.5-59.5C1024 905 1024 827 1024 512s0-393-59.5-452.5C905 0 827 0 512 0Z"/>
    </clipPath>
    <!-- teal → violet: action → progress (CEFR climb) -->
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="0.52" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <!-- subtle vertical lift on the steps so white reads as crisp paper -->
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4EFE8"/>
    </linearGradient>
    <radialGradient id="summit" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#FB923C"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- background -->
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- atmosphere: soft light bloom top-right, depth wash bottom-left -->
    <circle cx="828" cy="196" r="380" fill="#FFFFFF" opacity="0.10"/>
    <circle cx="150" cy="900" r="300" fill="#0B5C56" opacity="0.22"/>

    <!-- ascending steps (A1 → C2): 4 bold solid bars, equal gaps -->
    <g fill="url(#step)">
      <rect x="196" y="646" width="138" height="170" rx="40"/>
      <rect x="368" y="540" width="138" height="276" rx="40"/>
      <rect x="540" y="426" width="138" height="390" rx="40"/>
      <rect x="712" y="296" width="138" height="520" rx="40"/>
    </g>

    <!-- the climb: a rising rounded coral arc that lifts off the tallest step -->
    <path d="M236 700 Q452 656 540 470 T796 250"
          fill="none" stroke="#EA580C" stroke-width="56"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- summit: large two-tone focal dot -->
    <circle cx="796" cy="250" r="64" fill="url(#summit)"/>
    <circle cx="796" cy="250" r="32" fill="#EA580C"/>
  </g>
</svg>
