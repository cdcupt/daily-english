name: DailyEnglish
options:
  bundleIdPrefix: com.cdcupt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  DailyEnglish:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DailyEnglish/Sources
      - path: DailyEnglish/Resources
    settings:
      base:
        PRODUCT_NAME: DailyEnglish
        PRODUCT_BUNDLE_IDENTIFIER: com.cdcupt.DailyEnglish
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Dailingo"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Dailingo needs microphone access for speaking practice."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Dailingo needs speech recognition to evaluate your spoken answers."
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
