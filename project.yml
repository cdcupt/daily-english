name: DailyEnglish
options:
  bundleIdPrefix: com.cdcupt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: "8.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: NK3U2C365Z
    CODE_SIGN_STYLE: Automatic
  configs:
    # Headless simulator builds (CI / verification) sign nothing; release archives
    # sign normally with the team above.
    Debug:
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO

targets:
  DailyEnglish:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DailyEnglish/Sources
      - path: DailyEnglish/Resources
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: DailyEnglish/Info.plist
      properties:
        CFBundleDisplayName: Dailingo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Dailingo needs microphone access for speaking practice."
        NSSpeechRecognitionUsageDescription: "Dailingo needs speech recognition to evaluate your spoken answers."
        ITSAppUsesNonExemptEncryption: false
        GIDClientID: "328818408791-9fiml98belskdshtpdhq8smj8ls8qm7e.apps.googleusercontent.com"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "com.googleusercontent.apps.328818408791-9fiml98belskdshtpdhq8smj8ls8qm7e"
    entitlements:
      path: DailyEnglish/DailyEnglish.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_NAME: DailyEnglish
        PRODUCT_BUNDLE_IDENTIFIER: com.cdcupt.DailyEnglish
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
